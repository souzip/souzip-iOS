# ===== 비활성화 =====
disabled_rules:
  - trailing_whitespace
  - todo
  - multiple_closures_with_trailing_closure

# ===== Opt-in 규칙 =====
opt_in_rules:
  - force_unwrap
  - implicitly_unwrapped_optional
  - closure_spacing
  - unowned_variable_capture
  - private_over_fileprivate
  - empty_enum_arguments
  - weak_delegate
  - first_where
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - overridden_super_call
  - toggle_bool
  - closure_body_length

# ===== 규칙별 설정 =====
force_unwrap: error
implicitly_unwrapped_optional: error

line_length:
  warning: 150
  error: 160
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 500
  error: 700

cyclomatic_complexity:
  warning: 15
  error: 20

closure_body_length:
  warning: 40
  error: 80

identifier_name:
  min_length: 2
  excluded:
    - id
    - i
    - j
    - x
    - y
    - on
    - vc

type_name:
  min_length: 3
  max_length: 60

# ===== 제외 경로 =====
excluded:
  - Tuist
  - Derived
  - "**/*.generated.swift"
  - "**/Derived/**"
